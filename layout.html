<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Tic-Tac-Toe Game</title>
    <!-- Connecting the premium look theme stylesheet -->
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="game-wrapper">
        <h1>🎮 Custom Tic-Tac-Toe</h1>
        
        <!-- Professional Scoreboard Tracker UI -->
        <div class="scoreboard">
            <div class="score-box">
                <span class="player-label">🔥 Player X</span>
                <span id="scoreX" class="score-number">0</span>
            </div>
            <div class="score-box">
                <span class="player-label">🤝 Ties</span>
                <span id="scoreTies" class="score-number">0</span>
            </div>
            <div class="score-box">
                <span class="player-label">❄️ Player O</span>
                <span id="scoreO" class="score-number">0</span>
            </div>
        </div>
        
        <!-- Current Match Status Banner -->
        <div class="status-panel">
            <span id="statusText">Player <span class="x-color">🔥 X</span>'s Turn</span>
        </div>

        <!-- 3x3 Grid Matrix Box Framework -->
        <div class="game-board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <!-- Reset Button -->
        <button id="resetBtn" class="reset-btn">🔄 Restart Game</button>
    </div>

    <!-- Connecting the algorithmic brain logic engine script -->
    <script src="engine.js"></script>
</body>
</html>
